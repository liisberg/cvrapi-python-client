[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cvrapi-python-client"
version = "1.0.0"
description = "Python client for CVRAPI"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "Christian Liisberg" }
]
dependencies = [
    "requests>=2.34.2",
]

[project.urls]
Homepage = "https://github.com/cliisberg/cvrapi-python-client"
